<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic AI Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h2>Traffic Analysis</h2>
    <p class="subtitle">Junction: Main Road – Block A | Live Feed</p>

    <div class="stats">
        <p><b>Vehicle Count:</b> <span id="vehicles">-</span></p>
        <p><b>Traffic Density:</b> <span id="density">-</span></p>
        <p><b>Green Signal Time:</b> <span id="time">-</span> seconds</p>
        <p><b>Signal Countdown:</b> <span id="countdown">--</span> sec</p>
    </div>

    <div class="signal">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
